services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    # 一個指令把全部跑起來：裝依賴 → 等 DB → migrate+seed → 起服務。
    command: >
      bash -c "cp -n .env.example .env &&
               composer install --no-interaction --prefer-dist &&
               until php artisan migrate --force --seed; do echo 'db not ready, retrying in 3s...'; sleep 3; done &&
               php artisan serve --host=0.0.0.0 --port=8000"

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: step7
      MYSQL_USER: step7
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
